    <rect x="60" y="515" width="1160" height="335" rx="12"/>
    <rect x="60" y="885" width="1160" height="335" rx="12"/>
    <rect x="60" y="1255" width="1160" height="335" rx="12"/>
  </g>

  <g fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="85" y="181" font-size="21" font-weight="700">1. Set</text>
    <text x="85" y="204" font-size="13" fill="#687384">scale: 0-300 ns/op</text>
    <text x="85" y="551" font-size="21" font-weight="700">2. Set/Get</text>
    <text x="85" y="574" font-size="13" fill="#687384">scale: 0-1100 ns/op</text>
    <text x="85" y="921" font-size="21" font-weight="700">3. Get hit</text>
    <text x="85" y="944" font-size="13" fill="#687384">scale: 0-120 ns/op</text>
    <text x="85" y="1291" font-size="21" font-weight="700">4. Get miss</text>
    <text x="85" y="1314" font-size="13" fill="#687384">scale: 0-45 ns/op</text>
  </g>

