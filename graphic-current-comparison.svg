<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1660" viewBox="0 0 1280 1660" role="img" aria-labelledby="title desc">
  <title id="title">Current cache benchmark comparison</title>
  <desc id="desc">Vertical comparison of gocache New, gocache NewFast, go-cache, freecache, ristretto and bigcache across Set, Set/Get, Get hit and Get miss.</desc>
  <rect width="1280" height="1660" fill="#f5f7fb"/>
  <text x="60" y="54" fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">Current cache benchmark</text>
  <text x="60" y="84" fill="#5b6573" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Same workload | 10-minute TTL | Apple M3 Max | lower ns/op is better</text>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#17202a">
    <rect x="60" y="108" width="16" height="16" rx="3" fill="#2563eb"/><text x="84" y="121">gocache New</text>
    <rect x="220" y="108" width="16" height="16" rx="3" fill="#f97316"/><text x="244" y="121">gocache NewFast</text>
    <rect x="425" y="108" width="16" height="16" rx="3" fill="#16a34a"/><text x="449" y="121">go-cache</text>
    <rect x="565" y="108" width="16" height="16" rx="3" fill="#0891b2"/><text x="589" y="121">freecache</text>
    <rect x="710" y="108" width="16" height="16" rx="3" fill="#a855f7"/><text x="734" y="121">ristretto</text>
    <rect x="850" y="108" width="16" height="16" rx="3" fill="#475569"/><text x="874" y="121">bigcache</text>
  </g>

  <g fill="#ffffff" stroke="#dbe2ea" stroke-width="1">
